[workspace]
name = "kiribati-tb-summer4"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"
pandas = ">=2.2"
openpyxl = "*"
pyarrow = "*"
pyyaml = "*"
matplotlib = "*"
jupyterlab = "*"
ipykernel = "*"
pytest = "*"
black = "*"

[pypi-dependencies]
# JAX 0.8+ implements pmap as jit(shard_map), which crashes Diffrax's default
# RecursiveCheckpointAdjoint under parallel chains (found in tb-macro-summer4).
# 0.7.2 is the newest release where parallel chains work without a flag.
jax = "==0.7.2"
jaxlib = "==0.7.2"
# summer4 main at c9548d5 (after v0.2.0a5): Diffrax solver backends (step 29) let the port pick
# the forward-mode adjoint, and sample/find_map/optimize return run objects (step 30). K4b.
summer4 = { git = "https://github.com/monash-emu/summer4.git", rev = "c9548d57dc15e12e5017c117918bb7f1bd0165eb", extras = ["calibration", "pandas", "frames"] }
arviz = "*"
h5netcdf = "*"
h5py = "*"
plotly = ">=6.6, <7"
nbformat = "*"
kiribati_tb = { path = ".", editable = true }

[tasks]
test = "pytest -q -m 'not slow'"
test-slow = "pytest -q -m slow"
format = "black src tests scripts reference/make_golden.py"
format-check = "black --check src tests scripts reference/make_golden.py"
notebook = "jupyter lab notebooks"
synthetic-recovery = "python scripts/synthetic_recovery.py"
find-map = "python scripts/find_map.py"
calibrate = "python scripts/calibrate.py"
run-notebooks = "pytest -q -m slow tests/test_notebooks.py"
# Gradient-performance benchmarks (docs/gradient-performance.md); results in outputs/bench/.
bench-profile = "python scripts/bench/profile_gradient.py"
bench-levers = "python scripts/bench/levers.py"
bench-before-after = "python scripts/bench/before_after.py"
bench-stiffness = "python scripts/bench/stiffness.py"
bench-nan = "python scripts/bench/nan_rate.py"
bench-parallel = "python scripts/bench/parallel.py"
bench-ab = "python scripts/bench/process_ab.py"
bench-searchsorted = "python scripts/bench/searchsorted_ab.py"
bench-float32 = "python scripts/bench/float32_ab.py"
bench-energy = "python scripts/bench/energy_error.py"

[feature.reference]
platforms = ["osx-arm64", "linux-64"]
# Versions match monash-emu/kiribati_tb_modelling@46a63f0 pixi.lock, so the goldens are
# produced by the same stack the published analysis ran on.
dependencies = { python = "3.10.*", numpy = "==1.25.2", pandas = "==2.3.0", openpyxl = "*", pyarrow = "==21.0.0", pyyaml = "*" }
pypi-dependencies = { summerepi2 = { git = "https://github.com/monash-emu/summer2gen.git", rev = "aad6d4b414db2dbf81ea64e8aece5e0c6cdaa425" }, jax = "==0.4.38", jaxlib = "==0.4.38", computegraph = "==0.4.5" }
tasks = { golden = "python reference/make_golden.py" }

[environments]
default = { solve-group = "default" }
reference = { features = ["reference"], no-default-feature = true }
