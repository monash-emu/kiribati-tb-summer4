name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.81.0
          cache: true
          locked: true
      - run: pixi run format-check
      - run: pixi run test

  golden:
    name: Regenerate goldens (byte-stable)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.81.0
          environments: reference
          cache: true
          locked: true
      - run: pixi run -e reference golden
      - run: git diff --exit-code -- tests/golden
